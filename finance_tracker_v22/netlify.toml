# Netlify configuration for Finance Tracker

[build]
  # Files sit at the repo root. No build step — plain static files.
  publish = "."
  functions = "netlify/functions"

# Let the app call /api/claude instead of the long function path.
[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200

# Gmail ingestion webhook (the Apps Script posts here).
[[redirects]]
  from = "/api/ingest"
  to = "/.netlify/functions/ingest"
  status = 200

# Manual daily-snapshot trigger (for testing; secret-protected).
[[redirects]]
  from = "/api/send-snapshot-now"
  to = "/.netlify/functions/send-snapshot-now"
  status = 200

# Daily snapshot email — 01:45 UTC = 07:15 AM IST.
[functions."daily-email"]
  schedule = "45 1 * * *"

# Service worker must be served from root scope and never long-cached,
# so new versions are picked up promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

