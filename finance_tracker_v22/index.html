<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Finance Tracker</title>

  <!-- PWA: installable, theme + iOS home-screen support -->
  <link rel="manifest" href="manifest.webmanifest?v=47" />
  <meta name="theme-color" content="#0a5f46" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0f0e" media="(prefers-color-scheme: dark)" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finance" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=47" />
  <link rel="icon" type="image/png" href="icon-192.png?v=47" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=47" />
</head>
<body>
  <div id="root"></div>

  <!-- data layer (plain JS, must load first) -->
  <script src="store.js?v=47"></script>
  <!-- AI shim: no-op in the studio, calls your serverless proxy in production -->
  <script src="ai.js?v=47"></script>
  <!-- Supabase SDK + cloud sync (no-op until you fill in supabase-config.js) -->
  <script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="supabase-config.js?v=47"></script>
  <script src="cloud.js?v=47"></script>
  <!-- Spreadsheet + PDF parsing for statement imports -->
  <script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

  <!-- React + Babel (pinned) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- app modules -->
  <script type="text/babel" src="lib.jsx?v=47"></script>
  <script type="text/babel" src="compute.jsx?v=47"></script>
  <script type="text/babel" src="views_auth.jsx?v=47"></script>
  <script type="text/babel" src="views_onboarding.jsx?v=47"></script>
  <script type="text/babel" src="views_critic.jsx?v=47"></script>
  <script type="text/babel" src="views_dashboard.jsx?v=47"></script>
  <script type="text/babel" src="views_txns.jsx?v=47"></script>
  <script type="text/babel" src="views_networth.jsx?v=47"></script>
  <script type="text/babel" src="views_cards.jsx?v=47"></script>
  <script type="text/babel" src="views_investments.jsx?v=47"></script>
  <script type="text/babel" src="views_insights.jsx?v=47"></script>
  <script type="text/babel" src="views_chat.jsx?v=47"></script>
  <script type="text/babel" src="views_email.jsx?v=47"></script>
  <script type="text/babel" src="view_import.jsx?v=47"></script>
  <script type="text/babel" src="views_settings.jsx?v=47"></script>
  <script type="text/babel" src="views_hubs.jsx?v=47"></script>
  <script type="text/babel" src="app.jsx?v=47"></script>

  <!-- PWA: register the service worker (offline + installable). Ignored on http; needs https, which Netlify provides. -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) { console.warn("SW registration failed:", e); });
      });
    }

    // Capture the install prompt (Chrome/Android/desktop) and show a small button.
    var deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      deferredPrompt = e;
      showInstallButton();
    });
    function showInstallButton() {
      if (document.getElementById("ft-install-btn")) return;
      var b = document.createElement("button");
      b.id = "ft-install-btn";
      b.textContent = "Install app";
      b.style.cssText = "position:fixed;right:16px;bottom:16px;z-index:9999;background:#0a5f46;color:#fff;border:none;border-radius:10px;padding:11px 16px;font:600 14px/1 system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer;";
      b.onclick = function () {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        deferredPrompt.userChoice.finally(function () { deferredPrompt = null; b.remove(); });
      };
      document.body.appendChild(b);
    }
    // Already installed → hide nothing to show.
    window.addEventListener("appinstalled", function () {
      var b = document.getElementById("ft-install-btn"); if (b) b.remove();
    });
  </script>
</body>
</html>
